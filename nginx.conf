server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # High-Performance Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/javascript
        application/json
        application/wasm
        font/woff
        font/woff2
        font/ttf
        font/eot
        image/svg+xml;

    # Modern Security Headers (Removed deprecated X-XSS-Protection for 100% Best Practices)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # HTML & Manifest: Freshness validation without breaking bfcache (Back/Forward Cache)
    location ~* (?:index\.html|manifest\.json|sw\.js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Flutter Assets (return 404 for missing assets instead of serving index.html)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Static Assets Caching (Scripts, WASM, Fonts, Images, CSS, JSON, BIN)
    location ~* \.(?:woff|woff2|eot|ttf|png|jpe?g|gif|ico|svg|wasm|js|css|json|bin)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Flutter Web SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
