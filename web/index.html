<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NotaIA - Aplicativo inteligente de anotações inspirado no estilo Apple Notes com persistência local, desenho e IA.">

  <!-- Apple iOS Native Fullscreen App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NotaIA">
  
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon & Manifest -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Accessible Viewport (Maximum Scale 5.0 for Lighthouse 100% Score) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

  <!-- Resource Preload Hints -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      box-sizing: border-box;
    }
    html, body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #000000;
      z-index: 99999;
      pointer-events: none;
      transition: opacity 0.25s ease-out;
    }
    .logo-container {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(135deg, #D97706 0%, #F59E0B 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.4);
    }
    .logo-container svg {
      width: 34px;
      height: 34px;
      fill: #FFFFFF;
    }
    .spinner {
      margin-top: 24px;
      width: 24px;
      height: 24px;
      border: 2.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #D97706;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      margin-top: 14px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: #8E8E93;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo-container">
      <svg viewBox="0 0 24 24">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
      </svg>
    </div>
    <div class="spinner"></div>
    <div class="loading-text">Abrindo Notas...</div>
  </div>

  <script>
    // Register Dedicated Offline Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .catch(function (err) {
            console.log('ServiceWorker registration error:', err);
          });
      });
    }

    // High-performance Splash Screen dismissal
    function hideLoadingScreen() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(function() {
          if (loading && loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }
        }, 250);
      }
    }

    // Flutter engine first frame event
    window.addEventListener('flutter-first-frame', hideLoadingScreen);

    // Fallback direct child observer (zero deep subtree traversal)
    if (window.MutationObserver) {
      const obs = new MutationObserver(function (mutations) {
        for (let i = 0; i < mutations.length; i++) {
          const added = mutations[i].addedNodes;
          for (let j = 0; j < added.length; j++) {
            const tag = (added[j].nodeName || '').toLowerCase();
            if (tag === 'flutter-view' || tag === 'flt-glass-pane' || tag === 'canvas') {
              hideLoadingScreen();
              obs.disconnect();
              return;
            }
          }
        }
      });
      obs.observe(document.body, { childList: true, subtree: false });
    }

    // Fallback safety timeout
    setTimeout(hideLoadingScreen, 2800);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
