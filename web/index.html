<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NotaIA - Aplicativo moderno e inteligente de anotações estilo Apple Notes.">

  <!-- iOS PWA meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NotaIA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NotaIA - Notas</title>
  <link rel="manifest" href="manifest.json">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <style>
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #000000;
      z-index: 99999;
      transition: opacity 0.3s ease-out;
    }
    .logo-container {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(135deg, #D97706 0%, #F59E0B 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.4);
    }
    .logo-container svg {
      width: 34px;
      height: 34px;
      fill: #FFFFFF;
    }
    .spinner {
      margin-top: 24px;
      width: 24px;
      height: 24px;
      border: 2.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #D97706;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      margin-top: 14px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: #8E8E93;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo-container">
      <svg viewBox="0 0 24 24">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
      </svg>
    </div>
    <div class="spinner"></div>
    <div class="loading-text">Abrindo Notas...</div>
  </div>

  <script>
    // Register Service Worker for 100% Offline PWA Support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=1', { scope: './' })
          .then(function (reg) {
            console.log('ServiceWorker registered with scope:', reg.scope);
          })
          .catch(function (err) {
            console.log('ServiceWorker registration failed:', err);
          });
      });
    }

    // Smooth splash screen removal
    const observer = new MutationObserver((mutations, obs) => {
      const flt = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('canvas');
      if (flt) {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.style.opacity = '0';
          setTimeout(() => {
            if (loading) loading.remove();
          }, 300);
        }
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
    setTimeout(() => {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(() => {
          if (loading) loading.remove();
        }, 300);
      }
    }, 3500);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
